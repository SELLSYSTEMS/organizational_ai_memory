<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9f8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="Private employee workspace for governed personal and organizational memory."
    />
    <title>Workspace | Organizational AI Memory</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace-main">Skip to workspace</a>
    <div id="employee-app" aria-live="polite">
      <div class="boot-state">
        <span class="spinner" aria-hidden="true"></span>
        Checking workspace session...
      </div>
    </div>

    <dialog class="workspace-dialog" data-dialog aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-shell" data-dialog-form></form>
    </dialog>

    <div class="toast-region" aria-live="polite" aria-atomic="true" data-toast-region></div>
  </body>
</html>
