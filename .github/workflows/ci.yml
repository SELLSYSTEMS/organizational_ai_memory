name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API and release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Scan public repository and Git history
        run: node scripts/evaluation/verify_public_repository.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install media verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify public release package
        run: node scripts/evaluation/verify_release_package.mjs

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.mjs')

      - name: Run API and security tests
        run: npm run app:test


  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:5530681ea5d3e2ed4ce396f9b5cb443efbac6baf2a8a19c0c0635e40ae7eadce
        env:
          POSTGRES_DB: oam_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oam_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bootstrap isolated integration database
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: oam_integration
          PGUSER: postgres
          OAM_INTEGRATION_BOOTSTRAP_CONFIRM: BOOTSTRAP_ISOLATED_OAM_INTEGRATION_DATABASE
          OAM_INTEGRATION_BOOTSTRAP_ISOLATED_CLUSTER: CONFIRM_ISOLATED_POSTGRESQL_CLUSTER
        run: bash scripts/evaluation/bootstrap_integration_database.sh

      - name: Run PostgreSQL integration tests
        env:
          OAM_INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/oam_integration
          OAM_OPERATOR_INTEGRATION_DATABASE_URL: postgresql://oam_operator_api@127.0.0.1:5432/oam_integration
        run: node --test --test-concurrency=1 test/integration/*.test.mjs
